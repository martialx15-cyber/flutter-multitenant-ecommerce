name: flutter_multitenant_ecommerce

description: Cross-platform multi-tenant ecommerce app built with Flutter and Dart.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  provider: ^6.1.2
  dio: ^5.6.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
